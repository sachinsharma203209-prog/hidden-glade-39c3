name = "font-changer-seo"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# D1 Database Binding
# Create first: wrangler d1 create font-changer-db
# Then replace database_id with the actual D1 ID
[[d1_databases]]
binding = "FONT_CHANGER_DB"
database_name = "font-changer-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Production environment
[env.production]
name = "font-changer-seo-prod"

# Development environment
[env.development]
name = "font-changer-seo-dev"
